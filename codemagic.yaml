workflows:
  android-apk:
    name: Build Android APK
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: 1. Generate Android & Add Internet Permission
        script: |
          flutter create . --org com.laxmitrading.app --platforms=android
          
          # Python script जो 100% गारंटी के साथ AndroidManifest में इंटरनेट परमिशन जोड़ देगा
          python3 -c '
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r") as f:
              lines = f.readlines()
          
          new_lines = []
          added = False
          for line in lines:
              if "<application" in line and not added:
                  new_lines.append("    <uses-permission android:name=\"android.permission.INTERNET\"/>\n")
                  added = True
              new_lines.append(line)
              
          with open(path, "w") as f:
              f.writelines(new_lines)
          print("Internet permission injected successfully!")
          '
      - name: 2. Get Flutter packages
        script: |
          flutter pub get
      - name: 3. Build Android APK
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      
