workflows:
  android-apk:
    name: Build Android APK
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: 1. Generate Fresh Android Platform
        script: |
          flutter create . --org com.laxmitrading.app --platforms=android
      - name: 2. Get Flutter packages
        script: |
          flutter pub get
      - name: 3. Build Android APK
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      
