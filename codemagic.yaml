workflows:
  android-apk:
    name: Build Android APK
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Clean and setup Android platform
        script: |
          if [ -f "android/app/google-services.json" ]; then
            cp android/app/google-services.json ./google-services.json
          fi
          
          rm -rf android
          flutter create . --org com.laxmitrading.app --platforms=android --overwrite
          
          if [ -f "google-services.json" ]; then
            mkdir -p android/app
            cp google-services.json android/app/
          fi

          python3 -c '
          with open("android/settings.gradle", "r") as f:
              content = f.read()
          if "com.google.gms.google-services" not in content:
              content = content.replace("plugins {", "plugins {\n    id \"com.google.gms.google-services\" version \"4.4.1\" apply false")
              with open("android/settings.gradle", "w") as f:
                  f.write(content)

          with open("android/app/build.gradle", "r") as f:
              content = f.read()
          if "com.google.gms.google-services" not in content:
              content = content.replace("plugins {", "plugins {\n    id \"com.google.gms.google-services\"")
              with open("android/app/build.gradle", "w") as f:
                  f.write(content)
          '
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build Android APK
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      
