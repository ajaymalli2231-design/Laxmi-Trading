workflows:
  android-apk:
    name: Build Android APK
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: 1. Safe Android Setup & Internet Permission
        script: |
          # अगर एंड्रॉइड फोल्डर नहीं है, तभी बनाएगा (बार-बार डिलीट नहीं होगा)
          if [ ! -d "android" ]; then
            flutter create . --org com.laxmitrading.app --platforms=android
          fi
          
          # मैनिफेस्ट में पक्की इंटरनेट परमिशन जोड़ना
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
              python3 -c '
              path = "android/app/src/main/AndroidManifest.xml"
              with open(path, "r") as f:
                  content = f.read()
              content = content.replace("<application", "<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <application")
              with open(path, "w") as f:
                  f.write(content)
              '
            fi
          fi
      - name: 2. Get Flutter packages
        script: |
          flutter pub get
      - name: 3. Build Android APK
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      
