workflows:
  android-apk:
    name: Build Android APK
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: 1. Generate Android & Add Internet Permission
        script: |
          flutter create . --org com.laxmitrading.app --platforms=android
          
          # Python के जरिए एंड्रॉइड मैनिफेस्ट में पक्की इंटरनेट परमिशन जोड़ रहे हैं
          python3 -c '
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r") as f:
              content = f.read()
          if "android.permission.INTERNET" not in content:
              content = content.replace("<application", "<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <application")
              with open(path, "w") as f:
                  f.write(content)
          '
      - name: 2. Get Flutter packages
        script: |
          flutter pub get
      - name: 3. Build Android APK
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      
