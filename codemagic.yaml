workflows:
  android-apk:
    name: Build Android APK
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Backup Google Services file
        script: |
          if [ -f "android/app/google-services.json" ]; then
            cp android/app/google-services.json ./google-services.json
          fi
      - name: Clean and create fresh platform files
        script: |
          rm -rf android ios windows macos linux
          flutter create . --org com.laxmitrading.app
      - name: Restore Google Services file and apply plugin
        script: |
          if [ -f "google-services.json" ]; then
            mkdir -p android/app
            cp google-services.json android/app/
          fi
          # ग्रेडल फाइल में सही प्लगइन जोड़ना
          if ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          fi
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build Android APK
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      
