workflows:
  android-apk:
    name: Build Android APK
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: 1. Generate Android & Inject Permission
        script: |
          flutter create . --org com.laxmitrading.app --platforms=android
          
          # यह पाइथन कोड एंड्रॉइड मैनिफेस्ट में 100% गारंटी के साथ इंटरनेट परमिशन जोड़ देगा
          python3 -c '
          import os
          path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(path):
              with open(path, "r") as f:
                  content = f.read()
              if "android.permission.INTERNET" not in content:
                  content = content.replace("<application", "<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <application")
                  with open(path, "w") as f:
                      f.write(content)
                  print("SUCCESS: Internet permission injected!")
              else:
                  print("ALREADY PRESENT: Internet permission exists.")
          else:
              print("ERROR: Manifest file missing!")
          '
      - name: 2. Get Flutter packages
        script: |
          flutter pub get
      - name: 3. Build Android APK
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      
