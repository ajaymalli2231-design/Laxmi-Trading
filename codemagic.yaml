workflows:
  android-apk:
    name: Build Android APK
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: 1. Generate Android & Fix Internet Permission
        script: |
          flutter create . --org com.laxmitrading.app --platforms=android
          
          # पक्की पाइथन स्क्रिप्ट जो मैनिफेस्ट टैग के ठीक अंदर इंटरनेट परमिशन जोड़ेगी
          python3 -c '
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r") as f:
              content = f.read()
          
          if "android.permission.INTERNET" not in content:
              idx = content.find(">")
              if idx != -1:
                  content = content[:idx+1] + "\n    <uses-permission android:name=\"android.permission.INTERNET\"/>" + content[idx+1:]
                  with open(path, "w") as f:
                      f.write(content)
                  print("Internet permission injected successfully at correct place!")
          '
      - name: 2. Get Flutter packages
        script: |
          flutter pub get
      - name: 3. Build Android APK
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      
