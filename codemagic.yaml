workflows:
  android-apk:
    name: Build Android APK
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Generate Android and Build Direct via Gradle
        script: |
          flutter create . --org com.laxmitrading.app --platforms=android
          
          if [ -f "android/app/google-services.json" ]; then
            cp android/app/google-services.json ./google-services.json
          fi
          if [ -f "google-services.json" ]; then
            mkdir -p android/app
            cp google-services.json android/app/
          fi
          
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          
          # फ्लटर चेक को छोड़कर सीधे एंड्रॉइड ग्रेडल से APK बना रहे हैं
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/app-release.apk
      - build/app/outputs/flutter-apk/*.apk
      
