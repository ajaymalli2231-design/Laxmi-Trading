workflows:
  android-apk:
    name: Build Android APK
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Recreate clean android folder
        script: |
          if [ -f "android/app/google-services.json" ]; then
            cp android/app/google-services.json ./google-services.json
          fi
          # पुराने एंड्रॉइड फोल्डर को पूरी तरह साफ़ कर रहे हैं ताकि कोई पुराना ग्रेडल स्ट्रक्चर न बचे
          rm -rf android
          flutter create . --org com.laxmitrading.app --platforms=android
      - name: Restore Google Services file
        script: |
          if [ -f "google-services.json" ]; then
            mkdir -p android/app
            cp google-services.json android/app/
          fi
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build Android APK
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      
