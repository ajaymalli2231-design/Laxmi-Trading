workflows:
_android-apk:
    name: Build Android APK
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Clean and setup Android platform
        script: |
          if [ -f "android/app/google-services.json" ]; then
            cp android/app/google-services.json ./google-services.json
          fi
          
          rm -rf android
          flutter create . --org com.laxmitrading.app --platforms=android
          
          if [ -f "google-services.json" ]; then
            mkdir -p android/app
            cp google-services.json android/app/
          fi
      - name: Configure Gradle for Firebase
        script: |
          # app level build.gradle के अंत में गूगल सर्विसेज प्लगइन जोड़ना सबसे सुरक्षित तरीका है
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build Android APK
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      
