workflows:
  android-apk:
    name: Build Android APK
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: 1. Generate Fresh Android Platform
        script: |
          flutter create . --org com.laxmitrading.app --platforms=android
          
          # एंड्रॉइड मैनिफेस्ट में इंटरनेट की पक्की परमिशन जोड़ना
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i '' 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n<application/g' "$MANIFEST_PATH"
          fi
      - name: 2. Get Flutter packages
        script: |
          flutter pub get
      - name: 3. Build Android APK
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      
