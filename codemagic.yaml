workflows:
  android-apk:
    name: Build Android APK
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Clean old Android files and recreate
        script: |
          # google-services.json को सुरक्षित बचाने के लिए पहले उसे बाहर कॉपी कर लेते हैं
          if [ -f "android/app/google-services.json" ]; then
            cp android/app/google-services.json ./google-services.json
          fi
          rm -rf android
          flutter create . --org com.laxmitrading.app --platforms=android
      - name: Restore Google Services file
        script: |
          # जनरेट होने के बाद फाइल को वापस सही फोल्डर में डाल देंगे
          if [ -f "google-services.json" ]; then
            mkdir -p android/app
            cp google-services.json android/app/
          fi
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build Android APK
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      
